[project]
name = "farcaster-alpha-bot"
version = "0.1.0"
description = "Auto-post crypto alpha to Farcaster, sourced from Twitter, in aixbt_agent style."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.0",
    "feedparser>=6.0.11",
    "openai>=1.50.0",
    "PyYAML>=6.0.2",
    "python-dotenv>=1.0.1",
    "beautifulsoup4>=4.12.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
